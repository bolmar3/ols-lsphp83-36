name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # weekly rebuild to pick up base image / Ubuntu security updates
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.v.outputs.php }}
      ols: ${{ steps.v.outputs.ols }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Dockerfile ARG defaults are the single source of truth
        run: |
          php=$(sed -n 's/^ARG PHP_VERSION=//p' Dockerfile | head -n1)
          base=$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile | head -n1)
          ols=${base##*:}; ols=${ols%%-*}
          echo "php=$php" >> "$GITHUB_OUTPUT"
          echo "ols=$ols" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "PHP $php on OpenLiteSpeed $ols" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.versions.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ols-lsphp83:test
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke test
        run: ./test.sh ols-lsphp83:test "${{ needs.versions.outputs.php }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [versions, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.versions.outputs.image }}
      PHP: ${{ needs.versions.outputs.php }}
      OLS: ${{ needs.versions.outputs.ols }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.OLS }}-lsphp83-${{ env.PHP }}
            type=raw,value=lsphp83-${{ env.PHP }}
            type=raw,value=lsphp83
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$OLS-lsphp83-$PHP"
